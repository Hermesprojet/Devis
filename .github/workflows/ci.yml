name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aucun job de cette CI n'écrit sur le dépôt : elle ne lit que le code.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  domain:
    name: Domaine (calculs déterministes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/domain pytest ruff mypy
      - name: Format et lint
        run: |
          ruff format --check packages/domain
          ruff check packages/domain
      - name: Typage
        run: mypy packages/domain/src/metreo_domain
      - name: Tests
        run: pytest packages/domain/tests -q

  api-sqlite:
    name: API (SQLite, sans service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/domain
          pip install "fastapi>=0.115,<1.0" "uvicorn[standard]" "sqlalchemy>=2.0.30" alembic \
                      "pydantic[email]>=2.7" pydantic-settings python-multipart pyjwt \
                      pytest httpx ruff mypy
      - name: Format et lint
        run: |
          ruff format --check apps/api/src apps/api/tests
          ruff check apps/api/src apps/api/tests
      - name: Typage
        run: mypy apps/api/src/metreo_api
      - name: Tests
        working-directory: apps/api
        run: pytest -q

  api-postgres:
    name: API (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: metreo
          POSTGRES_PASSWORD: metreo
          POSTGRES_DB: metreo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metreo -d metreo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      METREO_DATABASE_URL: postgresql+psycopg://metreo:metreo@localhost:5432/metreo
      METREO_ENVIRONMENT: test
      METREO_JWT_SECRET: ci-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/domain
          pip install "fastapi>=0.115,<1.0" "uvicorn[standard]" "sqlalchemy>=2.0.30" alembic \
                      "pydantic[email]>=2.7" pydantic-settings python-multipart pyjwt \
                      "psycopg[binary]" pytest httpx
      - name: Migrations
        working-directory: apps/api
        run: |
          PYTHONPATH=src alembic -c alembic.ini upgrade head
          PYTHONPATH=src alembic -c alembic.ini downgrade base
          PYTHONPATH=src alembic -c alembic.ini upgrade head
      - name: Jeu de démonstration
        working-directory: apps/api
        run: PYTHONPATH=src python -m metreo_api.seed
      - name: Suite complète sur PostgreSQL réel
        working-directory: apps/api
        # METREO_TEST_DATABASE_URL fait tourner chaque test dans son propre
        # schéma sur le serveur ; sans lui la conftest retombe sur SQLite et ce
        # job ne prouverait rien sur NUMERIC, les contraintes ou le DDL
        # transactionnel.
        env:
          METREO_TEST_DATABASE_URL: postgresql+psycopg://metreo:metreo@localhost:5432/metreo
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Installer (verrouillé)
        run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: Parcours web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Installer l'API
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/domain
          pip install "fastapi>=0.115,<1.0" "uvicorn[standard]" "sqlalchemy>=2.0.30" alembic \
                      "pydantic[email]>=2.7" pydantic-settings python-multipart pyjwt
      - name: Installer le web (verrouillé)
        working-directory: apps/web
        run: npm ci
      - name: Installer Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        working-directory: apps/web
        # La configuration migre et sème une base jetable, construit le front
        # avec l'URL de l'API de test — NEXT_PUBLIC_* est inliné à la
        # compilation — puis démarre les deux serveurs.
        env:
          METREO_PYTHON: python
        run: npx playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  skills:
    name: Skills du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Frontmatter, chemins cités, données volatiles
        run: python scripts/check_skills.py

  secrets:
    name: Aucun secret commité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuser un .env versionné
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Un fichier .env est versionné." >&2
            exit 1
          fi
      - name: Motifs de secrets évidents
        run: |
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
               -- . ':!.github/workflows/ci.yml'; then
            echo "Motif de secret détecté." >&2
            exit 1
          fi
