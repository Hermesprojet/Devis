[alembic]
# `%(here)s` : le répertoire de CE fichier, et non le répertoire courant.
#
# Alembic résout un `script_location` relatif contre le répertoire d'où on
# l'appelle. Avec `script_location = alembic`, la commande documentée pour la
# préproduction — `alembic -c apps/api/alembic.ini upgrade head`, lancée depuis
# la racine, qui est le WORKDIR de l'image — cherchait `./alembic` et sortait
# en 255 : « Path doesn't exist: alembic ».
#
# La tâche de migration, celle qui doit réussir avant que l'API ne démarre, ne
# pouvait donc pas fonctionner dans le conteneur. Seule une exécution réelle
# pouvait le montrer ; la validation de syntaxe des compositions ne voyait rien.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
