[project]
name = "metreo-api"
version = "0.1.0"
description = "Metreo — HTTP API (monolithe modulaire)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  # L'extra "email" est requis, pas optionnel : schemas.py utilise EmailStr,
  # qui lève ImportError sans email-validator. La CI l'installait
  # explicitement dans sa ligne pip, ce qui masquait le manque ici — une
  # installation faite depuis ce fichier seul était cassée.
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  # L'extra "crypto" est requis, pas optionnel : un fournisseur OIDC signe
  # ses jetons en RS256 ou ES256, et PyJWT refuse ces algorithmes sans
  # `cryptography`. Sans lui, la validation de signature ne peut pas avoir
  # lieu — et une validation qu'on ne peut pas faire est une validation
  # qu'on finirait par contourner.
  "pyjwt[crypto]>=2.8",
  # Client HTTP d'exécution : découverte OIDC et échange du code. Il était
  # déclaré en dépendance de développement seulement, ce qui suffisait aux
  # tests et pas à l'application.
  "httpx>=0.27",
  # Lecture des classeurs XLSX. Une bibliothèque maintenue plutôt qu'un
  # analyseur OOXML maison : le format est vaste — chaînes partagées, styles,
  # dates sérielles — et en écrire un lecteur ici reviendrait à en devenir le
  # mainteneur. La défense contre les archives hostiles, elle, reste à nous :
  # openpyxl n'a jamais promis d'y résister, et `services/classeur.py` borne
  # l'archive avant de la lui donner.
  "openpyxl>=3.1,<4.0",
  "metreo-domain",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Lecture des plans DXF. OPTIONNEL à dessein : `ezdxf` tire numpy et
# fonttools, soit plusieurs dizaines de mégaoctets dont une API qui n'ouvre
# aucun plan n'a pas l'usage. `services/lecture_dxf.py` l'importe au moment de
# lire, et le module se charge sans lui.
#
# Licence MIT, version vérifiée le 2026-10-02 : voir
# docs/adr/0007-lecture-de-plans.md.
plans = [
  "ezdxf>=1.4.4,<2",
  # Pillow est une dépendance DURE du module de dessin d'ezdxf :
  # `ezdxf/addons/drawing/frontend.py` fait `import PIL.Image` au niveau du
  # module, sans garde. Sans elle, le rendu d'un plan lève `ModuleNotFoundError`
  # — trouvé en intégration continue, pas en local, où Pillow était installée
  # par autre chose. Seize tests sont tombés d'un coup.
  #
  # **Surtout pas `ezdxf[draw]`**, qui serait la façon « officielle » de la
  # déclarer : cet extra tire aussi **PyMuPDF, sous AGPL-3.0**, dont la clause
  # réseau obligerait à livrer le source de Metreo à ses utilisateurs — la
  # licence que l'ADR 0007 a explicitement écartée. Il tire en plus matplotlib
  # et PySide6, dont une API qui rend un SVG n'a aucun usage.
  #
  # Pillow est en MIT-CMU (champ `License-Expression` de la distribution
  # installée, vérifié) : permissive, sans clause réseau.
  "pillow>=11,<14",
]
# `pyyaml` : les contrôles d'infrastructure (ops/tests/) lisent les
# compositions Docker. Il arrivait jusqu'ici par les extras optionnels
# d'uvicorn ou de fastapi, que personne n'active — donc par hasard, et absent
# d'une installation propre.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metreo_api"]

[tool.hatch.metadata]
allow-direct-references = true
