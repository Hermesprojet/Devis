[project]
name = "metreo-api"
version = "0.1.0"
description = "Metreo — HTTP API (monolithe modulaire)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  # L'extra "email" est requis, pas optionnel : schemas.py utilise EmailStr,
  # qui lève ImportError sans email-validator. La CI l'installait
  # explicitement dans sa ligne pip, ce qui masquait le manque ici — une
  # installation faite depuis ce fichier seul était cassée.
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "metreo-domain",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-python-dateutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metreo_api"]

[tool.hatch.metadata]
allow-direct-references = true
