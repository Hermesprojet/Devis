[project]
name = "metreo-domain"
version = "0.1.0"
description = "Metreo — pure domain layer: money, units, deterministic pricing engine."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metreo_domain"]
