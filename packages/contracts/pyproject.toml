[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metreo-contracts"
version = "0.1.0"
description = "Contrats fournisseur-indépendants de Metreo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metreo_contracts"]
